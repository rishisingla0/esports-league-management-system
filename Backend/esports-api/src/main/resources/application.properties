spring.application.name=esports-api

# MySQL database connection
spring.datasource.url=jdbc:mysql://localhost:3306/esports_db
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# Preserve the existing database schema
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Validate entity mappings against the database
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000

app.cors.allowed-origin=${FRONTEND_URL:http://localhost:3000}

app.bootstrap-organizer.enabled=${BOOTSTRAP_ORGANIZER_ENABLED:false}
app.bootstrap-organizer.full-name=${ORGANIZER_NAME:}
app.bootstrap-organizer.email=${ORGANIZER_EMAIL:}
app.bootstrap-organizer.password=${ORGANIZER_PASSWORD:}
